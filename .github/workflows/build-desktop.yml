name: Gerar kiosk Linux

on:
  push:
    branches:
      - jukebox-admin-1.5.0
    paths:
      - 'desktop/**'
      - '.github/workflows/build-desktop.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Compilar Linux
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4
      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: desktop/package.json
      - name: Instalar dependências
        run: npm install
      - name: Gerar AppImage
        run: npm run dist:linux
      - name: Disponibilizar Linux
        uses: actions/upload-artifact@v4
        with:
          name: kiosk-Linux-1.5.0
          path: desktop/dist/*.AppImage
          if-no-files-found: error
          retention-days: 30
