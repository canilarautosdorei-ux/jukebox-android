name: Gerar Jukebox Windows e Linux

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - 'desktop/**'
      - '.github/workflows/build-desktop.yml'

permissions:
  contents: read

jobs:
  windows:
    name: Compilar Windows
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: desktop/package.json

      - name: Instalar dependências
        run: npm install

      - name: Gerar EXE
        run: npm run dist:win

      - name: Disponibilizar Windows
        uses: actions/upload-artifact@v4
        with:
          name: Jukebox-Windows
          path: desktop/dist/*.exe
          if-no-files-found: error
          retention-days: 30

  linux:
    name: Compilar Linux
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: desktop/package.json

      - name: Instalar dependências
        run: npm install

      - name: Gerar AppImage
        run: npm run dist:linux

      - name: Disponibilizar Linux
        uses: actions/upload-artifact@v4
        with:
          name: Jukebox-Linux
          path: desktop/dist/*.AppImage
          if-no-files-found: error
          retention-days: 30
