name: Publicar kiosk WebView Linux 1.5.2

on:
  push:
    branches:
      - kiosk-webview-1.5.0
    paths:
      - 'desktop/**'
      - '.github/workflows/build-desktop.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependências
        run: npm install

      - name: Gerar AppImage e DEB
        run: npm run dist:linux

      - name: Publicar artefatos do workflow
        uses: actions/upload-artifact@v4
        with:
          name: kiosk-WebView-Linux-1.5.2
          path: |
            desktop/dist/*.AppImage
            desktop/dist/*.deb
          if-no-files-found: error
          retention-days: 30

      - name: Criar ou atualizar Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: kiosk-webview-linux-1.5.2
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.AppImage dist/*.deb --clobber
          else
            gh release create "$TAG" dist/*.AppImage dist/*.deb \
              --title "kiosk WebView Linux 1.5.2" \
              --notes "Versão Linux com WebView embutido, tela cheia/kiosk, abrindo https://kiosk.r777b.site" \
              --target "$GITHUB_SHA"
          fi
