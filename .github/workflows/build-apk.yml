name: Gerar APK Jukebox

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build-apk:
    name: Compilar Jukebox APK
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Android 35
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Configurar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Preparar APK para download
        run: |
          mkdir -p output
          cp app/build/outputs/apk/debug/app-debug.apk output/Jukebox.apk
          ls -lh output/Jukebox.apk

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Jukebox-APK
          path: output/Jukebox.apk
          if-no-files-found: error
          retention-days: 30
