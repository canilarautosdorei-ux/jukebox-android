<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Jukebox</title>
  <style>
    html,body{margin:0;width:100%;height:100%;background:#070b12;color:#fff;font-family:Arial,sans-serif;overflow:hidden}
    body{display:flex;align-items:center;justify-content:center;text-align:center}
    .box{max-width:560px;padding:36px}
    .icon{font-size:62px;margin-bottom:16px}
    h1{font-size:30px;margin:0 0 12px}
    p{color:#b9c3d0;font-size:18px;line-height:1.5;margin:0 0 24px}
    a{display:inline-block;color:#fff;text-decoration:none;background:#1c73e8;border-radius:12px;padding:15px 26px;font-weight:800}
    .small{display:block;margin-top:18px;color:#7f8a99;font-size:14px}
  </style>
</head>
<body>
  <div class="box">
    <div class="icon">♪</div>
    <h1>Conexão indisponível</h1>
    <p>A Jukebox está tentando reconectar automaticamente.</p>
    <a href="jukebox://retry">TENTAR AGORA</a>
    <span class="small">Aguarde alguns segundos.</span>
  </div>
</body>
</html>
